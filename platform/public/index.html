<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="same-origin" />
    <title>Nebula · Your flower shop, made your own</title>
    <link rel="icon" type="image/jpeg" href="/assets/nebula-logo.jpg" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
      <a
        class="wordmark"
        href="/dashboard"
        data-nav
        aria-label="Nebula dashboard"
        ><span class="nebula-logo-mark" aria-hidden="true"
          ><img src="/assets/nebula-logo.jpg" alt="" width="640" height="640"
        /></span>
        nebula<span class="wordmark-dot">.</span></a
      >
      <span class="beta-label">YOUR FLOWER SHOP</span>
      <div id="accountNav" class="account-nav"></div>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading-view">
        <span class="loading-flower" aria-hidden="true">✳</span>
        <p>Making a little room for your flowers…</p>
      </div>
    </main>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <footer class="app-footer">
      <a href="/dashboard" data-nav>Nebula Sites Studio</a
      ><span>A little imagination. A beautiful bouquet.</span>
    </footer>
    <noscript
      ><p class="notice">
        JavaScript is needed to sign in and set up your private shop preview.
      </p></noscript
    >
  </body>
</html>
