<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="ppm-t">
  <title id="ppm-t">Petal Press</title>
  <!-- currentColor everywhere: the mark inherits text colour, so seasons.js
       can recolour it and it works white-on-dark with no second file. -->
  <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- The stamp ring. One nearly-closed hand-drawn circle, radii between
         32.8 and 34.8 so it wobbles like a hand, not like a mistake. -->
    <path d="M62 76.5C46 82.5 27 74 19.5 58.5 12 43 18 25.5 32 17 46 8.5 66 11 76 23.5 86 36 86.5 57 76.5 68.5 72.5 73 68.5 75.5 64.5 77"/>
    <!-- The stem is drawn to land exactly on the ring's start point, so the
         eye reads ring + stem + bloom as one unbroken stroke. -->
    <path d="M49.5 43C50.5 52 51.5 60 53.5 67 55 72 58 75.5 62 76.5"/>
    <path d="M52.6 62.4C57.2 60.2 63 60 65.6 63.2 62.6 67.2 56.6 67.6 52.6 65.4"/>
    <!-- Three petals, deliberately uneven. -->
    <path d="M49.8 43C45.6 37.5 43.4 29.8 46.6 24.6 49.2 20.4 54.4 22.2 55.6 27.8 56.9 33.8 54.2 39.2 49.8 43Z"/>
    <path d="M49.8 43C43.2 41.2 36.4 37.6 34.6 32.2 33.1 27.7 38.4 25.6 42.6 29.4 46.2 32.7 48.6 38.2 49.8 43Z"/>
    <path d="M49.8 43C56.4 41.6 63.2 38.4 65.4 33.2 67.2 28.9 62.2 26.2 57.8 29.6 54 32.6 51.2 38.2 49.8 43Z"/>
  </g>
</svg>
