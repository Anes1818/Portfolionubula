<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Petal Press">
  <!-- A second, deliberately different mark for 16-32 px.
       The line version is 2.8 units on a 100 unit box: at 16 px that is a
       0.45 px stroke, which the browser renders as pale grey mush.
       Here the shapes are FILLED and knocked out of a solid ink tile, so the
       silhouette survives any downscale. Same flower, different engineering. -->
  <rect width="64" height="64" rx="14" fill="#1F1B18"/>
  <path d="M32 52V33" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round"/>
  <path d="M33 44c5-4 11-4 14-1-3 4-9 5-14 3z" fill="#FBF7F0"/>
  <path d="M32 34c-5-3-8-9-5-13 3-4 9-2 10 4 1 4-1 7-5 9z" fill="#FBF7F0"/>
  <path d="M32 34c-6-1-11-4-12-8 0-4 5-4 8-1 3 2 4 6 4 9z" fill="#FBF7F0"/>
  <path d="M32 34c6-1 11-4 12-8 0-4-5-4-8-1-3 2-4 6-4 9z" fill="#FBF7F0"/>
</svg>
